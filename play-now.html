<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play Now</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #000;
      font-family: Arial, sans-serif;
    }
    button {
      padding: 16px 42px;
      border: 1px solid #fff;
      border-radius: 6px;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: background .2s, color .2s, transform .2s;
    }
    button:hover {
      background: transparent;
      color: #fff;
      transform: scale(1.04);
    }
  </style>
</head>
<body>
  <button type="button">PLAY NOW</button>
</body>
</html>
